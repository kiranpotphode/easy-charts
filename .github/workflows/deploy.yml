name: Deploy to WordPress.org

# Publishes a GitHub release (not a pre-release) to the WordPress.org plugin directory: the
# release's easy-charts.zip goes to SVN trunk and a tag, .wordpress-org/ to the SVN assets.
# Needs the SVN_USERNAME and SVN_PASSWORD secrets on the "wordpress-org" environment, where a
# required reviewer can approve each deploy.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: wordpress-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Unpack the release zip
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern easy-charts.zip
          unzip -q easy-charts.zip -d dist
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: easy-charts
          BUILD_DIR: dist/easy-charts
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ steps.zip.outputs.version }}

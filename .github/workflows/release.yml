name: Release

# Pushing a tag like v2.0.0 or v2.0.0-beta.1 builds the plugin zip and creates a GitHub release
# with it. Tags with a pre-release suffix (a "-") become GitHub pre-releases and stop there; other
# tags then deploy the release's zip to WordPress.org (the deploy job).
#
# The deploy is a job here, not a workflow on the "release published" event: a release created with
# the workflow's own token doesn't trigger other workflows.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in the release job: the zip is built from a clean install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php: '7.4'
          tools: composer:v2
          coverage: none

      - name: Check the tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          header=$(sed -n 's/^ \* Version: *//p' easy-charts.php)
          constant=$(sed -n "s/^define( 'EASY_CHARTS_VERSION', '\(.*\)' );/\1/p" easy-charts.php)
          package=$(node -p "require('./package.json').version")
          for found in "$header" "$constant" "$package"; do
            if [ "$found" != "$version" ]; then
              echo "::error::Tag $TAG does not match the versions in easy-charts.php ($header, $constant) and package.json ($package)."
              exit 1
            fi
          done
          if [[ "$version" != *-* ]]; then
            stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
            if [ "$stable" != "$version" ]; then
              echo "::error::readme.txt Stable tag is $stable, expected $version."
              exit 1
            fi
          fi

      - run: npm ci
      - name: Composer autoloader without dev packages
        run: composer install --no-dev --classmap-authoritative --no-interaction --no-progress
      - run: npm run build
      # The zip holds only runtime files (package.json "files", minus package.json itself).
      - run: npm run zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          zip_url="https://github.com/$REPO/releases/download/$TAG/easy-charts.zip"
          playground=$(node -e '
            const blueprint = require( "./.wordpress-org/blueprints/blueprint.json" );
            blueprint.steps.find( ( s ) => s.step === "installPlugin" ).pluginData = { resource: "url", url: process.argv[ 1 ] };
            console.log( "https://playground.wordpress.net/#" + encodeURIComponent( JSON.stringify( blueprint ) ) );
          ' "$zip_url")
          notes="Install: download easy-charts.zip below and upload it under Plugins → Add New → Upload Plugin.

          Try it in your browser: [open in WordPress Playground]($playground) (example charts included).

          See the changelog and the \"Upgrading from 1.x\" notes in readme.txt."
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" easy-charts.zip --title "Easy Charts ${TAG#v}" --notes "$notes" --verify-tag "${flags[@]}"

  # Publishes the release's easy-charts.zip to SVN trunk and a tag, and .wordpress-org/ to the SVN
  # assets. Needs the SVN_USERNAME and SVN_PASSWORD secrets on the "wordpress-org" environment, where
  # a required reviewer approves each deploy and only v* tags may deploy.
  deploy:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: wordpress-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unpack the release zip
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern easy-charts.zip
          unzip -q easy-charts.zip -d dist
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: easy-charts
          BUILD_DIR: dist/easy-charts
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ steps.zip.outputs.version }}
